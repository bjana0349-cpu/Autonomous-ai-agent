name: Android Jarvis Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Jarvis source ZIP
        run: |
          mkdir -p source
          unzip -q autonomous-ai-agent-final.zip -d source
          find source -maxdepth 4 -name settings.gradle.kts

      - name: Build Android APK
        working-directory: source/autonomous-ai-agent/android-jarvis
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: source/autonomous-ai-agent/android-jarvis/app/build/outputs/apk/debug/app-debug.apk
