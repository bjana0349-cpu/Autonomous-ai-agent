name: Android Jarvis Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'autonomous-ai-agent-final.zip'
      - '.github/workflows/android-jarvis.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK command-line tools and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          test -d "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/tmp/android-sdk-licenses.log
          tail -n 40 /tmp/android-sdk-licenses.log

      - name: Remove unnecessary Google TV add-ons
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT}"
          mapfile -t TV_PACKAGES < <(
            sdkmanager --sdk_root="$SDK_ROOT" --list_installed 2>/dev/null \
              | awk -F'|' '/google_tv|google-tv/ {gsub(/[[:space:]]/, "", $1); if ($1 != "") print $1}' \
              | sort -u
          )
          if [ "${#TV_PACKAGES[@]}" -gt 0 ]; then
            echo "Removing unnecessary Google TV packages: ${TV_PACKAGES[*]}"
            sdkmanager --sdk_root="$SDK_ROOT" --uninstall "${TV_PACKAGES[@]}"
          else
            echo "No Google TV add-ons installed."
          fi

      - name: Install only required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/tmp/android-sdk-licenses-after-install.log
          tail -n 40 /tmp/android-sdk-licenses-after-install.log

      - name: Verify SDK and source paths
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -s autonomous-ai-agent-final.zip
          unzip -l autonomous-ai-agent-final.zip | grep -q 'autonomous-ai-agent/android-jarvis/settings.gradle.kts'
          unzip -l autonomous-ai-agent-final.zip | grep -q 'autonomous-ai-agent/android-jarvis/app/build.gradle.kts'

      - name: Extract Jarvis source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q autonomous-ai-agent-final.zip -d source
          test -f source/autonomous-ai-agent/android-jarvis/settings.gradle.kts
          test -f source/autonomous-ai-agent/android-jarvis/app/build.gradle.kts

      - name: Build actual Android debug APK
        working-directory: source/autonomous-ai-agent/android-jarvis
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info :app:assembleDebug 2>&1 | tee build.log

      - name: Verify APK is non-empty
        run: test -s source/autonomous-ai-agent/android-jarvis/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload downloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: source/autonomous-ai-agent/android-jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Gradle/AAPT2 build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-log
          path: |
            source/autonomous-ai-agent/android-jarvis/build.log
            /tmp/android-sdk-licenses.log
            /tmp/android-sdk-licenses-after-install.log
          if-no-files-found: warn
